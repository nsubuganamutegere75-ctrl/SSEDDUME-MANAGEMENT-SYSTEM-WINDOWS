function money(n) { const x = Number(n); return Number.isFinite(x) ? Math.round((x + Number.EPSILON) * 100) / 100 : 0; }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDaysStr(days) { const d = new Date(); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function daysUntil(dateStr) { return Math.round((new Date(`${dateStr}T00:00:00`).getTime() - new Date(`${todayStr()}T00:00:00`).getTime()) / 86400000); }
function nowIso() { return new Date().toISOString(); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function checksum(obj) {
  const str = JSON.stringify(obj);
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 0x01000193);
    h2 = Math.imul(h2 ^ ch, 0x27d4eb2d);
  }
  return ((h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0")).toUpperCase();
}

let toastTimer = null;

  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);

/* ==================== 100% OFFLINE ISO/IEC 18004 QR ENGINE ==================== */
const IsoQrEngine = (() => {
  const SPECS = {
    1: { n: 21, data: 19, ec: 7, g1: 1, g2: 0, align: [] },
    2: { n: 25, data: 34, ec: 10, g1: 1, g2: 0, align: [6, 18] },
    3: { n: 29, data: 55, ec: 15, g1: 1, g2: 0, align: [6, 22] },
    4: { n: 33, data: 80, ec: 20, g1: 1, g2: 0, align: [6, 26] },
    5: { n: 37, data: 108, ec: 26, g1: 1, g2: 0, align: [6, 30] },
    6: { n: 41, data: 136, ec: 18, g1: 2, g2: 0, align: [6, 34] },
    7: { n: 45, data: 156, ec: 20, g1: 2, g2: 0, align: [6, 22, 38] },
    8: { n: 49, data: 194, ec: 24, g1: 2, g2: 0, align: [6, 24, 42] },
    9: { n: 53, data: 232, ec: 30, g1: 2, g2: 0, align: [6, 26, 46] },
    10: { n: 57, data: 274, ec: 18, g1: 2, g2: 2, align: [6, 28, 50] }
  };
  const FORMAT_INFO = [0x77c4, 0x72f3, 0x7daa, 0x789d, 0x662f, 0x6318, 0x6c41, 0x6976];
  const VERSION_INFO = { 7: 0x07c94, 8: 0x085bc, 9: 0x09a99, 10: 0x0a4d3 };
  const GF_EXP = new Uint8Array(512);
  const GF_LOG = new Uint8Array(256);
  let x = 1;
  for (let i = 0; i < 255; i++) { GF_EXP[i] = x; GF_LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
  function gfMul(a, b) { return (a === 0 || b === 0) ? 0 : GF_EXP[GF_LOG[a] + GF_LOG[b]]; }
  function rsGenerator(ecLen) {
    let poly = [1];
    for (let i = 0; i < ecLen; i++) {
      const next = new Array(poly.length + 1).fill(0);
      const factor = GF_EXP[i];
      for (let j = 0; j < poly.length; j++) { next[j] ^= poly[j]; next[j + 1] ^= gfMul(poly[j], factor); }
      poly = next;
    }
    return poly;
  }
  function rsEncodeBlock(block, ecLen) {
    const gen = rsGenerator(ecLen);
    const ecc = new Uint8Array(ecLen);
    for (let i = 0; i < block.length; i++) {
      const factor = block[i] ^ ecc[0];
      ecc.copyWithin(0, 1);
      ecc[ecLen - 1] = 0;
      if (factor !== 0) for (let j = 0; j < ecLen; j++) ecc[j] ^= gfMul(gen[j + 1], factor);
    }
    return ecc;
  }
  function pickVersion(byteLen) {
    for (let v = 1; v <= 10; v++) {
      const ccBits = v <= 9 ? 8 : 16;
      if (byteLen <= Math.floor((SPECS[v].data * 8 - 4 - ccBits) / 8)) return v;
    }
    return 10;
  }
  function applyMask(r, c, maskId) {
    switch (maskId) {
      case 0: return (r + c) % 2 === 0;
      case 1: return r % 2 === 0;
      case 2: return c % 3 === 0;
      case 3: return (r + c) % 3 === 0;
      case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
      case 5: return ((r * c) % 2) + ((r * c) % 3) === 0;
      case 6: return ((((r * c) % 2) + ((r * c) % 3)) % 2) === 0;
      case 7: return ((((r + c) % 2) + ((r * c) % 3)) % 2) === 0;
      default: return false;
    }
  }
  function penaltyScore(grid, n) {
    let score = 0;
    for (let r = 0; r < n; r++) {
      let run = 1;
      for (let c = 1; c < n; c++) {
        if (grid[r][c] === grid[r][c - 1]) run++;
        else { if (run >= 5) score += 3 + (run - 5); run = 1; }
      }
      if (run >= 5) score += 3 + (run - 5);
    }
    for (let c = 0; c < n; c++) {
      let run = 1;
      for (let r = 1; r < n; r++) {
        if (grid[r][c] === grid[r - 1][c]) run++;
        else { if (run >= 5) score += 3 + (run - 5); run = 1; }
      }
      if (run >= 5) score += 3 + (run - 5);
    }
    return score;
  }
  function buildBaseMatrix(ver, stream) {
    const spec = SPECS[ver], n = spec.n;
    const mod = Array.from({ length: n }, () => Array(n).fill(0));
    const isFunc = Array.from({ length: n }, () => Array(n).fill(false));
    const setFunc = (r, c, dark) => { if (r >= 0 && r < n && c >= 0 && c < n) { mod[r][c] = dark ? 1 : 0; isFunc[r][c] = true; } };
    const drawFinder = (r0, c0) => {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        setFunc(r0 + r, c0 + c, r >= 0 && r <= 6 && c >= 0 && c <= 6 && (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)));
      }
    };
    drawFinder(0, 0); drawFinder(0, n - 7); drawFinder(n - 7, 0);
    for (const r0 of spec.align) for (const c0 of spec.align) {
      if ((r0 < 9 && c0 < 9) || (r0 < 9 && c0 > n - 10) || (r0 > n - 10 && c0 < 9)) continue;
      for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) setFunc(r0 + r, c0 + c, Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0));
    }
    for (let i = 8; i < n - 8; i++) { setFunc(6, i, i % 2 === 0); setFunc(i, 6, i % 2 === 0); }
    setFunc(n - 8, 8, true);
    for (let i = 0; i < 9; i++) if (i !== 6) { isFunc[8][i] = true; isFunc[i][8] = true; }
    for (let i = 0; i < 8; i++) { isFunc[8][n - 1 - i] = true; isFunc[n - 1 - i][8] = true; }
    if (ver >= 7) for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) { isFunc[i][n - 11 + j] = true; isFunc[n - 11 + j][i] = true; }
    let bitPos = 0, goingUp = true;
    for (let col = n - 1; col >= 1; col -= 2) {
      if (col === 6) col = 5;
      for (let step = 0; step < n; step++) {
        const r = goingUp ? (n - 1 - step) : step;
        for (let offset = 0; offset < 2; offset++) {
          const c = col - offset;
          if (!isFunc[r][c]) mod[r][c] = bitPos < stream.length ? stream[bitPos++] : 0;
        }
      }
      goingUp = !goingUp;
    }
    return { mod, isFunc, n };
  }
  function stampMetadata(grid, ver, maskId) {
    const n = grid.length, fmt = FORMAT_INFO[maskId], fmtBits = [];
    for (let i = 14; i >= 0; i--) fmtBits.push((fmt >> i) & 1);

    const vCoords = [[n-1,8],[n-2,8],[n-3,8],[n-4,8],[n-5,8],[n-6,8],[n-7,8],[8,n-8],[8,n-7],[8,n-6],[8,n-5],[8,n-4],[8,n-3],[8,n-2],[8,n-1]];
    for (let i = 0; i < 15; i++) { grid[hCoords[i][0]][hCoords[i][1]] = fmtBits[i]; grid[vCoords[i][0]][vCoords[i][1]] = fmtBits[i]; }
    if (ver >= 7 && VERSION_INFO[ver]) {
      const vBits = VERSION_INFO[ver];
      for (let i = 0; i < 18; i++) {
        const bit = (vBits >> i) & 1, r = Math.floor(i / 3), c = n - 11 + (i % 3);
        grid[r][c] = bit; grid[c][r] = bit;
      }
    }
  }
  function encodeSvg(text, pxSize = 188) {
    let bytes = new TextEncoder().encode(String(text || "SSEDDUME"));
    const maxAllowed = Math.floor((SPECS[10].data * 8 - 4 - 16) / 8);
    if (bytes.length > maxAllowed) bytes = bytes.slice(0, maxAllowed);
    const ver = pickVersion(bytes.length), spec = SPECS[ver], ccBits = ver <= 9 ? 8 : 16, bits = [];
    const pushBits = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    pushBits(0b0100, 4); pushBits(bytes.length, ccBits);
    for (let i = 0; i < bytes.length; i++) pushBits(bytes[i], 8);
    pushBits(0, Math.min(4, spec.data * 8 - bits.length));
    while (bits.length % 8 !== 0) bits.push(0);
    const dataCodewords = [];
    for (let i = 0; i < bits.length; i += 8) { let cw = 0; for (let b = 0; b < 8; b++) cw = (cw << 1) | bits[i + b]; dataCodewords.push(cw); }
    const padBytes = [0xec, 0x11]; let padIdx = 0;
    while (dataCodewords.length < spec.data) dataCodewords.push(padBytes[padIdx++ % 2]);
    const blocksData = [], blocksEc = []; let cursor = 0;
    const totalBlocks = spec.g1 + spec.g2, shortBlockLen = Math.floor(spec.data / totalBlocks);
    for (let b = 0; b < totalBlocks; b++) {
      const len = b < spec.g1 ? shortBlockLen : (shortBlockLen + 1);
      const blk = dataCodewords.slice(cursor, cursor + len); cursor += len;
      blocksData.push(blk); blocksEc.push(rsEncodeBlock(blk, spec.ec));
    }
    const finalCodewords = [], maxDataLen = Math.max(...blocksData.map(x => x.length));
    for (let i = 0; i < maxDataLen; i++) for (let b = 0; b < blocksData.length; b++) if (i < blocksData[b].length) finalCodewords.push(blocksData[b][i]);
    for (let i = 0; i < spec.ec; i++) for (let b = 0; b < blocksEc.length; b++) finalCodewords.push(blocksEc[b][i]);
    const stream = [];
    for (const cw of finalCodewords) for (let b = 7; b >= 0; b--) stream.push((cw >> b) & 1);
    const { mod, isFunc, n } = buildBaseMatrix(ver, stream);
    let bestGrid = null, bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      const candidate = mod.map((row, r) => row.map((val, c) => isFunc[r][c] ? val : (val ^ (applyMask(r, c, m) ? 1 : 0))));
      stampMetadata(candidate, ver, m);
      const sc = penaltyScore(candidate, n);
      if (sc < bestScore) { bestScore = sc; bestGrid = candidate; }
    }
    const quietZone = 4, cell = pxSize / (n + quietZone * 2);
    let rects = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (bestGrid[r][c]) {
      rects += `<rect x="${((c + quietZone) * cell).toFixed(2)}" y="${((r + quietZone) * cell).toFixed(2)}" width="${(cell + 0.14).toFixed(2)}" height="${(cell + 0.14).toFixed(2)}" fill="#0f172a"/>`;
    }
    return `<svg width="${pxSize}" height="${pxSize}" viewBox="0 0 ${pxSize} ${pxSize}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${pxSize}" height="${pxSize}" fill="#ffffff"/>${rects}</svg>`;
  }
  return { encodeSvg };
})();

function defaultDb() {
  return {
    shop: { name: "SSEDDUME DRUG SHOP MANAGEMENT SYSTEM", branchCode: gatewayInfo.branchCode || "LOC-MAIN", branchName: gatewayInfo.branchName || "MAIN BRANCH", nda: "", lg: "", currency: "UGX" },
    staff: [
      { id: "U-OWNER", name: "Owner / Administrator", role: "Owner", regNo: "NDA-OWN-01", pin: "0000", active: true },
      { id: "U-MGR", name: "In-Charge Pharmacist", role: "In-Charge", regNo: "NDA-IC-01", pin: "1111", active: true },
      { id: "U-DISP", name: "Dispensing Staff", role: "Dispenser", regNo: "NDA-DSP-01", pin: "", active: true }
    ],
    medicines: [], batches: [], sales: [], credits: [], audit: [], appliedEvents: [], syncOutbox: []
  };
}

function loadDb() {
  try {
    const raw = localStorage.getItem(storageKeyForBranch());
    if (!raw) return defaultDb();
    const p = JSON.parse(raw), d = defaultDb();
    return {
      ...d, ...p,
      shop: { ...d.shop, ...(p.shop || {}) },
      staff: Array.isArray(p.staff) && p.staff.length ? p.staff : d.staff,
      medicines: Array.isArray(p.medicines) ? p.medicines : [],
      batches: Array.isArray(p.batches) ? p.batches : [],
      sales: Array.isArray(p.sales) ? p.sales : [],
      credits: Array.isArray(p.credits) ? p.credits : [],
      audit: Array.isArray(p.audit) ? p.audit : [],
      appliedEvents: Array.isArray(p.appliedEvents) ? p.appliedEvents : [],
      syncOutbox: Array.isArray(p.syncOutbox) ? p.syncOutbox : []
    };
  } catch (_) { return defaultDb(); }
}

let db = defaultDb();
let currentOperator = db.staff[0];
let activeTab = "sell";
let activePairingMode = "STAFF";
let basket = [];

function canDo(cap) {
  const role = currentOperator?.role || "Dispenser";
  return Array.isArray(ROLE_CAPS[role]) && ROLE_CAPS[role].includes(cap);
}
function guardAction(cap, label = "this action") {
  if (canDo(cap)) return true;
  alert(`Clearance denied: ${currentOperator.name} (${currentOperator.role}) is not authorized for ${label}.`);
  return false;
}

function saveDb() {
  localStorage.setItem(storageKeyForBranch(), JSON.stringify(db));
  localStorage.setItem(snapKeyForBranch(), JSON.stringify({ savedAt: nowIso(), chk: checksum(db), data: db }));

}

function addAudit(action, detail) {
  const entry = { time: nowIso(), branchCode: gatewayInfo.branchCode || db.shop.branchCode || "LOC-MAIN", user: `${currentOperator.name} (${currentOperator.role})`, action, detail };
  db.audit.unshift(entry);
  return entry;
}

/* ==================== NATIVE WEBVIEW2 IPC BRIDGE ==================== */
function postNativeCmd(payload) {
  if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function") {
    window.chrome.webview.postMessage(payload);
    return true;
  }
  return false;
}

if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener("message", (ev) => {
    const msg = ev.data || {};
    if (msg.type === "GATEWAY_INFO" && msg.data) {
      const prevCode = gatewayInfo.branchCode;
      gatewayInfo = { ...gatewayInfo, ...msg.data };
      if (prevCode && gatewayInfo.branchCode && prevCode !== gatewayInfo.branchCode) {
        db = loadDb();
        currentOperator = db.staff.find(s => s.active !== false) || db.staff[0];
      }
      db.shop.branchCode = gatewayInfo.branchCode;
      db.shop.branchName = gatewayInfo.branchName;
      saveDb();
      renderTopbar();
      if (activeTab === "admin") render();
    } else if (msg.type === "EVENTS_BATCH" && Array.isArray(msg.data)) {
      let changed = false;
      for (const item of msg.data) {
        if (applyIncomingEvent(item)) changed = true;
      }
      if (changed) { saveDb(); render(); toast("Synchronized POS & scan events"); }
    }
  });
}

function emitEvent(eventType, payload) {
  const bCode = gatewayInfo.branchCode || db.shop.branchCode || "LOC-MAIN";
  const eventId = `${bCode}-${getDevId()}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
  db.appliedEvents.push(eventId);
  if (db.appliedEvents.length > 8000) db.appliedEvents = db.appliedEvents.slice(-8000);
  const ev = { event_id: eventId, branch_id: bCode, branch_name: gatewayInfo.branchName || db.shop.branchName || "MAIN BRANCH", device_id: getDevId(), event_type: eventType, payload };
  db.syncOutbox.push(ev);
  postNativeCmd({ cmd: "PUSH_EVENT", event: ev });
}

function applyIncomingEvent(ev) {
  if (!ev || !ev.event_id) return false;
  const localBranch = gatewayInfo.branchCode || db.shop.branchCode || "LOC-MAIN";
  if (ev.branch_id && ev.branch_id !== localBranch) return false;
  if (db.appliedEvents.includes(ev.event_id)) return false;
  db.appliedEvents.push(ev.event_id);
  const p = ev.payload || {};
  if (ev.event_type === "MED_UPSERT" && p.med) {
    const idx = db.medicines.findIndex(m => m.id === p.med.id);
    if (idx >= 0) Object.assign(db.medicines[idx], p.med);
    else db.medicines.push(p.med);
  } else if (ev.event_type === "BATCH_GRN" && p.batch) {
    if (!db.batches.some(b => b.id === p.batch.id)) db.batches.push(p.batch);
  } else if (ev.event_type === "BATCH_DELTA" && p.batchId && Number.isInteger(p.delta)) {
    const b = db.batches.find(x => x.id === p.batchId);
    if (b) b.qty = Math.max(0, b.qty + p.delta);
  } else if (ev.event_type === "STOCK_ADJUST" && p.batchId && Number.isInteger(p.newQty)) {
    const b = db.batches.find(x => x.id === p.batchId);
    if (b) b.qty = Math.max(0, p.newQty);
  } else if (ev.event_type === "SALE_LINE" && p.sale) {
    if (!db.sales.some(s => s.id === p.sale.id)) db.sales.unshift(p.sale);
  } else if (ev.event_type === "SALE_VOID" && p.saleId) {
    const s = db.sales.find(x => x.id === p.saleId);
    if (s && !s.voided) {
      s.voided = true; s.cashPaid = 0; s.mmPaid = 0;
      const b = db.batches.find(x => x.id === s.batchId);
      if (b) b.qty += s.qty;
    }
  } else if (ev.event_type === "CREDIT_UPSERT" && p.credit) {
    const idx = db.credits.findIndex(c => c.id === p.credit.id);
    if (idx >= 0) Object.assign(db.credits[idx], p.credit);
    else db.credits.unshift(p.credit);
  }
  return true;
}

function getActiveQrPayload() {
  const bCode = gatewayInfo.branchCode || db.shop.branchCode || "LOC-MAIN";
  const ep = gatewayInfo.endpoint || "http://127.0.0.1:8080";
  const host = gatewayInfo.host || "STATION";
  if (activePairingMode === "OWNER") {
    return gatewayInfo.ownerQrPayload || `SSEDDUME-POS|OWNER|${bCode}|${host}|${ep}|${gatewayInfo.ownerToken || "OWN-LOCAL"}`;
  }
  return gatewayInfo.staffQrPayload || `SSEDDUME-POS|STAFF|${bCode}|${host}|${ep}|${gatewayInfo.staffToken || "STF-LOCAL"}`;
}

function fallbackCopyText(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (_) {}
  document.body.removeChild(ta);
}

function copyPairPayload() {
  const str = getActiveQrPayload();
  if (!str) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(str).catch(() => fallbackCopyText(str));
  } else {
    fallbackCopyText(str);
  }
  toast("Pairing payload copied");
}

function syncGatewayNow() {
  postNativeCmd({ cmd: "GET_GATEWAY_INFO" });
  postNativeCmd({ cmd: "POLL_EVENTS" });
  renderTopbar();
  render();

}

function repairWindowsPort8080() {
  if (!guardAction("admin", "repairing Windows port 8080 & firewall")) return;

}

  if (!guardAction("pairing", "rotating station pairing credentials")) return;

function saveBranchIdentity() {
  if (!guardAction("admin", "updating branch / location identity")) return;
  const nextName = (document.getElementById("bName")?.value || "").trim();

setInterval(() => {
  postNativeCmd({ cmd: "POLL_EVENTS" });
}, 4000);

function renderTopbar() {
  const bName = gatewayInfo.branchName || db.shop.branchName || "MAIN BRANCH";
  const bCode = gatewayInfo.branchCode || db.shop.branchCode || "LOC-MAIN";
  document.getElementById("hdrTitle").textContent = db.shop.name || "SSEDDUME DRUG SHOP MANAGEMENT SYSTEM";
  document.getElementById("hdrBranchTag").textContent = `${bName} (${bCode})`;
  document.getElementById("hdrSub").textContent = `NDA: ${db.shop.nda || "N/A"} • LG: ${db.shop.lg || "N/A"} • ${gatewayInfo.endpoint || "Universal POS Gateway"}`;
  document.getElementById("hdrUser").textContent = `${currentOperator.name} (${currentOperator.role})`;

  const sel = document.getElementById("operatorSelect");
  sel.innerHTML = db.staff.filter(s => s.active !== false).map(s =>
    `<option value="${esc(s.id)}" ${s.id === currentOperator.id ? "selected" : ""}>${esc(s.name)} — ${esc(s.role)}</option>`
  ).join("");

  if (adminBtn) adminBtn.style.display = canDo("admin") ? "" : "none";

  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab));
}

function changeOperator() {
  const prev = currentOperator;
  const target = db.staff.find(s => s.id === document.getElementById("operatorSelect").value);
  if (!target) return;
  if (target.pin && target.pin.trim() !== "") {
    const entered = prompt(`Enter authorization PIN for ${target.name} (${target.role}):`);
    if (entered === null || entered.trim() !== target.pin.trim()) {
      document.getElementById("operatorSelect").value = prev.id;
      if (entered !== null) alert("Invalid PIN.");
      return;
    }
  }
  currentOperator = target;
  addAudit("CLEARANCE_SWITCH", `Active clearance changed to ${target.name} (${target.role})`);
  saveDb(); render(); toast(`Active clearance: ${target.name}`);
}

function switchTab(tab) {
  if (tab === "admin" && !guardAction("admin", "Gateway, Branch & Keys settings")) return;
  activeTab = tab;
  if (tab === "admin") postNativeCmd({ cmd: "GET_GATEWAY_INFO" });
  render();
}

function batchState(b) {
  if (b.quarantined) return "QUARANTINED";
  if (b.expiry < todayStr()) return "EXPIRED";
  if (b.expiry === todayStr()) return "EXPIRES_TODAY";
  if (b.qty <= 0) return "DEPLETED";
  return "ACTIVE";
}
function isDispenseEligible(b) { return batchState(b) === "ACTIVE"; }
function availQty(medId) { return db.batches.filter(b => b.medId === medId && isDispenseEligible(b)).reduce((s, b) => s + b.qty, 0); }

function render() {
  const el = document.getElementById("mainView");
  if (activeTab === "admin") renderAdmin(el);
  else if (activeTab === "grn") renderGrn(el);
  else if (activeTab === "meds") renderMeds(el);
  else if (activeTab === "reports") renderReports(el);
  else renderSell(el);
  renderTopbar();
}

function renderSell(el) {
  const usable = db.medicines.filter(m => m.nda_schedule !== "RESTRICTED");
  const opts = usable.map(m => `<option value="${esc(m.id)}">${esc(m.generic_name)} ${esc(m.strength)} — ${availQty(m.id)} ${esc(m.base_unit)}</option>`).join("");
  el.innerHTML = `
    <div class="card">
      <h3>Point-of-Sale Dispensing (Strict FEFO)</h3>
      <div class="row">
        <select id="sMed" style="flex:1.4;min-width:240px;">${opts || '<option value="">No eligible stock</option>'}</select>
        <input id="sQty" type="number" min="1" value="1" style="width:90px;" />
        <input id="sPrice" type="number" min="0" step="0.01" placeholder="Unit Price" style="width:125px;" />
        <button class="primary" onclick="quickSell()">Dispense Cash</button>
      </div>
    </div>
  `;
}
function quickSell() {
  const med = db.medicines.find(x => x.id === document.getElementById("sMed")?.value);
  const qty = parseInt(document.getElementById("sQty")?.value || "0", 10);
  const unitPrice = money(parseFloat(document.getElementById("sPrice")?.value || med?.default_unit_price || "0"));
  if (!med || qty <= 0 || qty > availQty(med.id)) return alert("Select valid stock and quantity.");
  let rem = qty;
  const batches = db.batches.filter(b => b.medId === med.id && isDispenseEligible(b)).sort((a, b) => a.expiry.localeCompare(b.expiry));
  for (const b of batches) {
    if (rem <= 0) break;
    const take = Math.min(b.qty, rem);
    b.qty -= take; rem -= take;
    const saleRec = { id: `S-${Date.now()}`, time: nowIso(), medId: med.id, medName: med.generic_name, batchId: b.id, batchNo: b.batchNo, qty: take, unitPrice, total: money(take * unitPrice), payMethod: "CASH", cashPaid: money(take * unitPrice), mmPaid: 0, dispenser: currentOperator.name, voided: false };
    db.sales.unshift(saleRec);
    emitEvent("BATCH_DELTA", { batchId: b.id, delta: -take });
    emitEvent("SALE_LINE", { sale: saleRec });
  }
  saveDb(); render(); toast("Dispensed");
}

function renderGrn(el) {

  const batch = { id: `B-${Date.now()}`, medId, wholesaler, invoiceNo, batchNo, expiry, qty, quarantined: false };
  db.batches.push(batch);
  emitEvent("BATCH_GRN", { batch });

}

}

function setPairingMode(mode) {
  activePairingMode = mode === "OWNER" ? "OWNER" : "STAFF";

}

function exportBundleJson() {
  const pkg = { branchCode: gatewayInfo.branchCode, exportedAt: nowIso(), data: db };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(pkg, null, 2)], { type: "application/json" }));
  a.download = `sseddume-${(gatewayInfo.branchCode || "loc-main").toLowerCase()}-${todayStr()}.json`;
  a.click();
}
async function importBundleJson(ev) {
  const f = ev.target.files?.[0];
  ev.target.value = "";
  if (!f) return;
  const raw = JSON.parse(await f.text());
  const payload = raw?.data || raw;
  if (Array.isArray(payload.medicines)) db.medicines = payload.medicines;
  if (Array.isArray(payload.batches)) db.batches = payload.batches;
  if (Array.isArray(payload.sales)) db.sales = payload.sales;
  saveDb(); render(); toast("Snapshot imported");
}
