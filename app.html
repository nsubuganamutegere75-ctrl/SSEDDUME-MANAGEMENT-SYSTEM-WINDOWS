<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #e8eef5;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-soft: #ccfbf1;
      --accent: #0369a1;
      --accent-soft: #e0f2fe;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }

    .win-topbar {
      background: linear-gradient(135deg, #0f172a, #115e59);
      color: #fff; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 30;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.22);
    }
    .win-brand { font-size: 16px; font-weight: 800; letter-spacing: 0.01em; }
    .win-sub { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
    .pill {
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24);
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #34d399; }
    .sync-dot.offline { background: #fbbf24; }

    .layout {
      display: grid; grid-template-columns: 248px 1fr; gap: 16px;
      max-width: 1420px; margin: 16px auto; padding: 0 16px 32px; align-items: start;
    }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .sidebar {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px; box-shadow: var(--shadow); position: sticky; top: 72px;
    }
    .nav-item {
      width: 100%; text-align: left; padding: 10px 12px; border-radius: 9px;
      border: none; background: transparent; color: var(--text); font-weight: 600;
      font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px;
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 10px; font-size: 15.5px; font-weight: 700; }

    .kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 12px; margin-bottom: 14px;
    }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; box-shadow: var(--shadow);
    }
    .kpi-lbl { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .kpi-val { font-size: 19px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

    .grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; align-items: start; }
    @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

    .pair-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .pair-tab {
      min-height: 34px; padding: 6px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;
    }
    .pair-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .qr-card {
      display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
      background: linear-gradient(135deg, #f0fdfa, #f0f9ff);
      border: 1px solid #99f6e4; border-radius: 12px; padding: 14px 16px;
    }
    .qr-box {
      background: #fff; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; min-width: 212px; min-height: 212px;
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    input, select, textarea, button {
      min-height: 38px; padding: 7px 11px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 13.5px; background: #fff; color: var(--text);
    }
    button { cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover:not(:disabled) { background: var(--primary-dark); }
    button.secondary { background: #1e293b; color: #fff; border-color: #1e293b; }
    button.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); min-height: 32px; padding: 4px 9px; font-size: 12px; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
    th { background: var(--surface-2); color: var(--muted); font-size: 11px; text-transform: uppercase; padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; font-variant-numeric: tabular-nums; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .ok { background: var(--ok-soft); color: var(--ok); }
    .warn { background: var(--warn-soft); color: var(--warn); }
    .bad { background: var(--danger-soft); color: var(--danger); }
    .info { background: var(--accent-soft); color: var(--accent); }

    .alert { border-radius: 10px; padding: 10px 13px; margin-bottom: 10px; font-size: 12.5px; border: 1px solid transparent; }
    .alert-warn { background: var(--warn-soft); border-color: #fcd34d; color: #78350f; }
    .alert-bad { background: var(--danger-soft); border-color: #fca5a5; color: #7f1d1d; }
    .alert-info { background: var(--accent-soft); border-color: #7dd3fc; color: #0c4a6e; }

    #toast {
      position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff;
      padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 200;
    }
    #toast.show { opacity: 1; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.78); z-index: 150; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #fff; color: var(--text); border-radius: 12px; padding: 18px; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; }
    @media print {
      .win-topbar, .layout .sidebar, .no-print, #toast { display: none !important; }
      .layout { display: block; margin: 0; padding: 0; }
      .modal { position: static; background: none; display: block !important; }
      .modal-box { box-shadow: none; max-width: 100%; }
    }
  </style>
</head>

<script>
const STORAGE_KEY = "sseddume_gateway_db_v3";
const SNAP_KEY = "sseddume_gateway_snap_v3";
const CLOUD_CFG_KEY = "sseddume_gateway_cloud_cfg_v3";
const DEV_ID_KEY = "sseddume_gateway_dev_id_v3";

const ROLE_CAPS = {
  Owner: ["dispense", "grn", "meds", "void_sale", "settle_credit", "reports", "audit_full", "admin", "pairing", "staff"],
  "In-Charge": ["dispense", "grn", "meds", "void_sale", "settle_credit", "reports"],
  Dispenser: ["dispense"]
};

function getDevId() {
  let id = localStorage.getItem(DEV_ID_KEY);
  if (!id) {
    id = "TRM-" + Math.random().toString(36).slice(2, 9).toUpperCase();
    localStorage.setItem(DEV_ID_KEY, id);
  }
  return id;
}
function money(n) {
  const x = Number(n);
  return Number.isFinite(x) ? Math.round((x + Number.EPSILON) * 100) / 100 : 0;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function addDaysStr(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function daysUntil(dateStr) {
  const a = new Date(`${todayStr()}T00:00:00`).getTime();
  const b = new Date(`${dateStr}T00:00:00`).getTime();
  return Math.round((b - a) / 86400000);
}
function nowIso() { return new Date().toISOString(); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function checksum(obj) {
  const str = JSON.stringify(obj);
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 0x01000193);
    h2 = Math.imul(h2 ^ ch, 0x27d4eb2d);
  }
  return ((h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0")).toUpperCase();
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ==================== 100% OFFLINE ISO/IEC 18004 QR CODE ENGINE (VERSIONS 1-10, ECC-L) ==================== */
const IsoQrEngine = (() => {
  // Version specs for ECC Level L (1-10): [modulesPerSide, totalDataCodewords, ecCodewordsPerBlock, numBlocksGroup1, numBlocksGroup2, alignCenters]
  const SPECS = {
    1:  { n: 21,  data: 19,  ec: 7,  g1: 1, g2: 0, align: [] },
    2:  { n: 25,  data: 34,  ec: 10, g1: 1, g2: 0, align: [6, 18] },
    3:  { n: 29,  data: 55,  ec: 15, g1: 1, g2: 0, align: [6, 22] },
    4:  { n: 33,  data: 80,  ec: 20, g1: 1, g2: 0, align: [6, 26] },
    5:  { n: 37,  data: 108, ec: 26, g1: 1, g2: 0, align: [6, 30] },
    6:  { n: 41,  data: 136, ec: 18, g1: 2, g2: 0, align: [6, 34] },
    7:  { n: 45,  data: 156, ec: 20, g1: 2, g2: 0, align: [6, 22, 38] },
    8:  { n: 49,  data: 194, ec: 24, g1: 2, g2: 0, align: [6, 24, 42] },
    9:  { n: 53,  data: 232, ec: 30, g1: 2, g2: 0, align: [6, 26, 46] },
    10: { n: 57,  data: 274, ec: 18, g1: 2, g2: 2, align: [6, 28, 50] }
  };

  // Format information bits for ECC L (01) and masks 0..7
  const FORMAT_INFO = [
    0x77c4, 0x72f3, 0x7daa, 0x789d,
    0x662f, 0x6318, 0x6c41, 0x6976
  ];

  // Version information bits for Versions 7..10
  const VERSION_INFO = {
    7:  0x07c94,
    8:  0x085bc,
    9:  0x09a99,
    10: 0x0a4d3
  };

  const GF_EXP = new Uint8Array(512);
  const GF_LOG = new Uint8Array(256);
  let x = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = x;
    GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];

  function gfMul(a, b) {
    return (a === 0 || b === 0) ? 0 : GF_EXP[GF_LOG[a] + GF_LOG[b]];
  }
  function rsGenerator(ecLen) {
    let poly = [1];
    for (let i = 0; i < ecLen; i++) {
      const next = new Array(poly.length + 1).fill(0);
      const factor = GF_EXP[i];
      for (let j = 0; j < poly.length; j++) {
        next[j] ^= poly[j];
        next[j + 1] ^= gfMul(poly[j], factor);
      }
      poly = next;
    }
    return poly;
  }
  function rsEncodeBlock(block, ecLen) {
    const gen = rsGenerator(ecLen);
    const ecc = new Uint8Array(ecLen);
    for (let i = 0; i < block.length; i++) {
      const factor = block[i] ^ ecc[0];
      ecc.copyWithin(0, 1);
      ecc[ecLen - 1] = 0;
      if (factor !== 0) {
        for (let j = 0; j < ecLen; j++) {
          ecc[j] ^= gfMul(gen[j + 1], factor);
        }
      }
    }
    return ecc;
  }

  function pickVersion(byteLen) {
    for (let v = 1; v <= 10; v++) {
      const ccBits = v <= 9 ? 8 : 16;
      const maxBytes = Math.floor((SPECS[v].data * 8 - 4 - ccBits) / 8);
      if (byteLen <= maxBytes) return v;
    }
    return 10;
  }

  function applyMask(r, c, maskId) {
    switch (maskId) {
      case 0: return (r + c) % 2 === 0;
      case 1: return r % 2 === 0;
      case 2: return c % 3 === 0;
      case 3: return (r + c) % 3 === 0;
      case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
      case 5: return ((r * c) % 2) + ((r * c) % 3) === 0;
      case 6: return ((((r * c) % 2) + ((r * c) % 3)) % 2) === 0;
      case 7: return ((((r + c) % 2) + ((r * c) % 3)) % 2) === 0;
      default: return false;
    }
  }

  function penaltyScore(grid, n) {
    let score = 0;
    // Rule 1: runs of 5+ same color in rows & cols
    for (let r = 0; r < n; r++) {
      let run = 1;
      for (let c = 1; c < n; c++) {
        if (grid[r][c] === grid[r][c - 1]) run++;
        else { if (run >= 5) score += 3 + (run - 5); run = 1; }
      }
      if (run >= 5) score += 3 + (run - 5);
    }
    for (let c = 0; c < n; c++) {
      let run = 1;
      for (let r = 1; r < n; r++) {
        if (grid[r][c] === grid[r - 1][c]) run++;
        else { if (run >= 5) score += 3 + (run - 5); run = 1; }
      }
      if (run >= 5) score += 3 + (run - 5);
    }
    // Rule 2: 2x2 blocks of same color
    for (let r = 0; r < n - 1; r++) {
      for (let c = 0; c < n - 1; c++) {
        const v = grid[r][c];
        if (v === grid[r][c + 1] && v === grid[r + 1][c] && v === grid[r + 1][c + 1]) score += 3;
      }
    }
    return score;
  }

  function buildBaseMatrix(ver, stream) {
    const spec = SPECS[ver];
    const n = spec.n;
    const mod = Array.from({ length: n }, () => Array(n).fill(0));
    const isFunc = Array.from({ length: n }, () => Array(n).fill(false));

    const setFunc = (r, c, dark) => {
      if (r >= 0 && r < n && c >= 0 && c < n) {
        mod[r][c] = dark ? 1 : 0;
        isFunc[r][c] = true;
      }
    };

    const drawFinder = (r0, c0) => {
      for (let r = -1; r <= 7; r++) {
        for (let c = -1; c <= 7; c++) {
          const dark = r >= 0 && r <= 6 && c >= 0 && c <= 6 &&
            (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4));
          setFunc(r0 + r, c0 + c, dark);
        }
      }
    };

    drawFinder(0, 0);
    drawFinder(0, n - 7);
    drawFinder(n - 7, 0);

    // Alignment patterns
    const centers = spec.align;
    for (let i = 0; i < centers.length; i++) {
      for (let j = 0; j < centers.length; j++) {
        const r0 = centers[i], c0 = centers[j];
        const overlapsFinder = (r0 < 9 && c0 < 9) || (r0 < 9 && c0 > n - 10) || (r0 > n - 10 && c0 < 9);
        if (overlapsFinder) continue;
        for (let r = -2; r <= 2; r++) {
          for (let c = -2; c <= 2; c++) {
            const dark = Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0);
            setFunc(r0 + r, c0 + c, dark);
          }
        }
      }
    }

    // Timing patterns
    for (let i = 8; i < n - 8; i++) {
      setFunc(6, i, i % 2 === 0);
      setFunc(i, 6, i % 2 === 0);
    }

    // Dark module
    setFunc(n - 8, 8, true);

    // Reserve format info cells
    for (let i = 0; i < 9; i++) {
      if (i !== 6) {
        isFunc[8][i] = true;
        isFunc[i][8] = true;
      }
    }
    for (let i = 0; i < 8; i++) {
      isFunc[8][n - 1 - i] = true;
      isFunc[n - 1 - i][8] = true;
    }

    // Reserve version info cells for Versions 7+
    if (ver >= 7) {
      for (let i = 0; i < 6; i++) {
        for (let j = 0; j < 3; j++) {
          isFunc[i][n - 11 + j] = true;
          isFunc[n - 11 + j][i] = true;
        }
      }
    }

    // Place data & EC bits in upward/downward zig-zag columns
    let bitPos = 0;
    let goingUp = true;
    for (let col = n - 1; col >= 1; col -= 2) {
      if (col === 6) col = 5;
      for (let step = 0; step < n; step++) {
        const r = goingUp ? (n - 1 - step) : step;
        for (let offset = 0; offset < 2; offset++) {
          const c = col - offset;
          if (!isFunc[r][c]) {
            mod[r][c] = bitPos < stream.length ? stream[bitPos++] : 0;
          }
        }
      }
      goingUp = !goingUp;
    }

    return { mod, isFunc, n };
  }

  function stampMetadata(grid, ver, maskId) {
    const n = grid.length;
    const fmt = FORMAT_INFO[maskId];
    const fmtBits = [];
    for (let i = 14; i >= 0; i--) fmtBits.push((fmt >> i) & 1);

    const hCoords = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    const vCoords = [[n-1,8],[n-2,8],[n-3,8],[n-4,8],[n-5,8],[n-6,8],[n-7,8],[8,n-8],[8,n-7],[8,n-6],[8,n-5],[8,n-4],[8,n-3],[8,n-2],[8,n-1]];

    for (let i = 0; i < 15; i++) {
      grid[hCoords[i][0]][hCoords[i][1]] = fmtBits[i];
      grid[vCoords[i][0]][vCoords[i][1]] = fmtBits[i];
    }

    if (ver >= 7 && VERSION_INFO[ver]) {
      const vBits = VERSION_INFO[ver];
      for (let i = 0; i < 18; i++) {
        const bit = (vBits >> i) & 1;
        const r = Math.floor(i / 3);
        const c = n - 11 + (i % 3);
        grid[r][c] = bit;
        grid[c][r] = bit;
      }
    }
  }

  function encodeSvg(text, pxSize = 188) {
    const encoder = new TextEncoder();
    let bytes = encoder.encode(String(text || "SSEDDUME"));
    const maxAllowed = Math.floor((SPECS[10].data * 8 - 4 - 16) / 8);
    if (bytes.length > maxAllowed) bytes = bytes.slice(0, maxAllowed);

    const ver = pickVersion(bytes.length);
    const spec = SPECS[ver];
    const ccBits = ver <= 9 ? 8 : 16;
    const bits = [];
    const pushBits = (val, len) => {
      for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
    };

    // Byte mode indicator (0100) + character count + raw UTF-8 bytes
    pushBits(0b0100, 4);
    pushBits(bytes.length, ccBits);
    for (let i = 0; i < bytes.length; i++) pushBits(bytes[i], 8);

    const totalDataBits = spec.data * 8;
    pushBits(0, Math.min(4, totalDataBits - bits.length));
    while (bits.length % 8 !== 0) bits.push(0);

    const dataCodewords = [];
    for (let i = 0; i < bits.length; i += 8) {
      let cw = 0;
      for (let b = 0; b < 8; b++) cw = (cw << 1) | bits[i + b];
      dataCodewords.push(cw);
    }

    const padBytes = [0xec, 0x11];
    let padIdx = 0;
    while (dataCodewords.length < spec.data) {
      dataCodewords.push(padBytes[padIdx++ % 2]);
    }

    // Split into blocks and compute Reed-Solomon ECC codewords
    const blocksData = [];
    const blocksEc = [];
    let cursor = 0;
    const totalBlocks = spec.g1 + spec.g2;
    const shortBlockLen = Math.floor(spec.data / totalBlocks);

    for (let b = 0; b < totalBlocks; b++) {
      const len = b < spec.g1 ? shortBlockLen : (shortBlockLen + 1);
      const blk = dataCodewords.slice(cursor, cursor + len);
      cursor += len;
      blocksData.push(blk);
      blocksEc.push(rsEncodeBlock(blk, spec.ec));
    }

    // Interleave data blocks then ECC blocks
    const finalCodewords = [];
    const maxDataLen = Math.max(...blocksData.map(x => x.length));
    for (let i = 0; i < maxDataLen; i++) {
      for (let b = 0; b < blocksData.length; b++) {
        if (i < blocksData[b].length) finalCodewords.push(blocksData[b][i]);
      }
    }
    for (let i = 0; i < spec.ec; i++) {
      for (let b = 0; b < blocksEc.length; b++) {
        finalCodewords.push(blocksEc[b][i]);
      }
    }

    const stream = [];
    for (const cw of finalCodewords) {
      for (let b = 7; b >= 0; b--) stream.push((cw >> b) & 1);
    }

    const { mod, isFunc, n } = buildBaseMatrix(ver, stream);

    // Evaluate masks 0..7 and pick lowest penalty score
    let bestGrid = null;
    let bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      const candidate = mod.map((row, r) => row.map((val, c) => isFunc[r][c] ? val : (val ^ (applyMask(r, c, m) ? 1 : 0))));
      stampMetadata(candidate, ver, m);
      const sc = penaltyScore(candidate, n);
      if (sc < bestScore) {
        bestScore = sc;
        bestGrid = candidate;
      }
    }

    const quietZone = 4;
    const cell = pxSize / (n + quietZone * 2);
    let rects = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (bestGrid[r][c]) {
          const x0 = ((c + quietZone) * cell).toFixed(2);
          const y0 = ((r + quietZone) * cell).toFixed(2);
          const w0 = (cell + 0.14).toFixed(2);
          rects += `<rect x="${x0}" y="${y0}" width="${w0}" height="${w0}" fill="#0f172a"/>`;
        }
      }
    }
    return `<svg width="${pxSize}" height="${pxSize}" viewBox="0 0 ${pxSize} ${pxSize}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${pxSize}" height="${pxSize}" fill="#ffffff"/>${rects}</svg>`;
  }

  return { encodeSvg };
})();

/* ==================== IDEMPOTENT EVENT STREAMING & MERGE ==================== */
function emitEvent(eventType, payload) {
  db.appliedEvents = Array.isArray(db.appliedEvents) ? db.appliedEvents : [];
  db.syncOutbox = Array.isArray(db.syncOutbox) ? db.syncOutbox : [];
  const eventId = `${getDevId()}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
  db.appliedEvents.push(eventId);
  if (db.appliedEvents.length > 8000) db.appliedEvents = db.appliedEvents.slice(-8000);

  const cfg = getCloudCfg();
  const ev = {
    event_id: eventId,
    shop_id: cfg.shopId || "SSEDDUME-MAIN",
    device_id: getDevId(),
    event_type: eventType,
    payload
  };
  db.syncOutbox.push(ev);
  pushEventToGateway(ev);
  flushCloudOutbox();
}

function applyIncomingEvent(ev) {
  if (!ev || !ev.event_id) return false;
  db.appliedEvents = Array.isArray(db.appliedEvents) ? db.appliedEvents : [];
  if (db.appliedEvents.includes(ev.event_id)) return false;
  db.appliedEvents.push(ev.event_id);
  if (db.appliedEvents.length > 8000) db.appliedEvents = db.appliedEvents.slice(-8000);

  const p = ev.payload || {};
  if (ev.event_type === "MED_UPSERT" && p.med) {
    const idx = db.medicines.findIndex(m => m.id === p.med.id);
    if (idx >= 0) Object.assign(db.medicines[idx], p.med);
    else db.medicines.push(p.med);
  } else if (ev.event_type === "BATCH_GRN" && p.batch) {
    if (!db.batches.some(b => b.id === p.batch.id)) db.batches.push(p.batch);
  } else if (ev.event_type === "BATCH_DELTA" && p.batchId && Number.isInteger(p.delta)) {
    const b = db.batches.find(x => x.id === p.batchId);
    if (b) b.qty = Math.max(0, b.qty + p.delta);
  } else if (ev.event_type === "SALE_LINE" && p.sale) {
    if (!db.sales.some(s => s.id === p.sale.id)) db.sales.unshift(p.sale);
  } else if (ev.event_type === "SALE_VOID" && p.saleId) {
    const s = db.sales.find(x => x.id === p.saleId);
    if (s && !s.voided) {
      s.voided = true; s.cashPaid = 0; s.mmPaid = 0;
      const b = db.batches.find(x => x.id === s.batchId);
      if (b) b.qty += s.qty;
    }
  } else if (ev.event_type === "CREDIT_UPSERT" && p.credit) {
    const idx = db.credits.findIndex(c => c.id === p.credit.id);
    if (idx >= 0) Object.assign(db.credits[idx], p.credit);
    else db.credits.unshift(p.credit);
  } else if (ev.event_type === "AUDIT_NOTE" && p.entry && canDo("audit_full")) {
    db.audit.unshift(p.entry);
  }
  return true;
}

async function fetchWithTimeout(url, opts = {}, ms = 7000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(t);
  }
}

async function pushEventToGateway(ev) {
  try {
    const headers = { "Content-Type": "application/json" };
    if (gatewayInfo.ownerToken) headers["X-Pair-Token"] = gatewayInfo.ownerToken;
    await fetchWithTimeout("http://127.0.0.1:8080/api/events", {
      method: "POST",
      headers,
      body: JSON.stringify(ev)
    }, 3000);
  } catch (_) {}
}

async function pollGatewayEvents() {
  try {
    const headers = {};
    if (gatewayInfo.ownerToken) headers["X-Pair-Token"] = gatewayInfo.ownerToken;
    const res = await fetchWithTimeout("http://127.0.0.1:8080/api/events", { headers, cache: "no-store" }, 3000);
    if (!res.ok) return;
    const list = await res.json();
    if (!Array.isArray(list)) return;
    let changed = false;
    for (const ev of list) {
      if (applyIncomingEvent(ev)) changed = true;
    }
    if (changed) {
      saveDb();
      render();
      toast("Synchronized POS & scan events from gateway");
    }
  } catch (_) {}
}

async function rotateGatewayKeys() {

let cloudBusy = false;
async function flushCloudOutbox() {
  const cfg = getCloudCfg();
  if (!cfg.enabled || !cfg.url || !cfg.anonKey || !navigator.onLine || cloudBusy) return;
  cloudBusy = true;
  try {
    const hdr = {
      "apikey": cfg.anonKey,
      "Authorization": `Bearer ${cfg.anonKey}`,
      "Content-Type": "application/json",
      "Prefer": "resolution=ignore-duplicates,return=minimal"
    };
    if (db.syncOutbox.length > 0) {
      const chunk = db.syncOutbox.slice(0, 50).map(x => ({ ...x, shop_id: cfg.shopId }));
      const r = await fetchWithTimeout(`${cfg.url}/rest/v1/dsms_events?on_conflict=event_id`, {
        method: "POST", headers: hdr, body: JSON.stringify(chunk)
      }, 8000);
      if (r.ok) {
        const done = new Set(chunk.map(x => x.event_id));
        db.syncOutbox = db.syncOutbox.filter(x => !done.has(x.event_id));
        saveDb();
      }
    }
    const pr = await fetchWithTimeout(`${cfg.url}/rest/v1/dsms_events?shop_id=eq.${encodeURIComponent(cfg.shopId)}&seq=gt.${cfg.lastSeq || 0}&order=seq.asc&limit=200`, {
      headers: { "apikey": cfg.anonKey, "Authorization": `Bearer ${cfg.anonKey}` }
    }, 8000);
    if (pr.ok) {
      const rows = await pr.json();
      let changed = false, maxSeq = cfg.lastSeq || 0;
      for (const row of rows) {
        if (row.seq > maxSeq) maxSeq = row.seq;
        if (row.device_id !== getDevId() && applyIncomingEvent(row)) changed = true;
      }
      if (maxSeq > (cfg.lastSeq || 0)) {
        cfg.lastSeq = maxSeq;
        saveCloudCfg(cfg);
      }
      if (changed) { saveDb(); render(); toast("Pulled remote synchronization events"); }
    }
  } catch (_) {}
  finally { cloudBusy = false; updateSyncBadge(); }
}

function updateSyncBadge() {
  const dot = document.getElementById("syncDot");

  const qLen = (db.syncOutbox || []).length;
  const cfg = getCloudCfg();
  if (!navigator.onLine) {
    dot.className = "sync-dot offline";
    txt.textContent = `Offline (${qLen} queued)`;
  } else if (cfg.enabled) {
    dot.className = "sync-dot";
    txt.textContent = qLen > 0 ? `Syncing (${qLen})` : "Gateway & Cloud Active";
  } else {
    dot.className = "sync-dot";
    txt.textContent = qLen > 0 ? `Gateway / Queued (${qLen})` : "Gateway Ready";
  }
}

function batchState(b) {
  if (b.quarantined) return "QUARANTINED";
  if (b.expiry < todayStr()) return "EXPIRED";
  if (b.expiry === todayStr()) return "EXPIRES_TODAY";
  if (b.qty <= 0) return "DEPLETED";
  return "ACTIVE";
}
function isDispenseEligible(b) {
  return batchState(b) === "ACTIVE";
}
function isNearExpiry(b) {
  const st = batchState(b);
  return (st === "ACTIVE" || st === "EXPIRES_TODAY") && b.expiry <= addDaysStr(30);
}
function isCritExpiry(b) {
  const st = batchState(b);
  return (st === "ACTIVE" || st === "EXPIRES_TODAY") && b.expiry <= addDaysStr(7);
}
function availQty(medId) {
  return db.batches.filter(b => b.medId === medId && isDispenseEligible(b)).reduce((s, b) => s + b.qty, 0);
}
function openCreditTotal() {
  return money(db.credits.filter(c => !c.settled).reduce((s, c) => s + money(c.balance), 0));
}

function renderAlerts() {
  const html = [];
  const crit = db.batches.filter(isCritExpiry);
  if (crit.length) html.push(`<div class="alert alert-bad"><strong>Expiry Watch (≤ 7 days):</strong> ${crit.length} batch(es) expire within 7 days (batches expiring today are blocked from dispensing).</div>`);
  const low = db.medicines.filter(m => m.nda_schedule !== "RESTRICTED" && availQty(m.id) <= (m.reorder_level || 0));
  if (low.length) html.push(`<div class="alert alert-warn"><strong>Reorder Threshold:</strong> ${low.length} item(s) at or below reorder level (${low.slice(0, 5).map(m => esc(m.generic_name)).join(", ")}).</div>`);
  return html.join("");
}

  const mm = money(okSales.reduce((a, b) => a + money(b.mmPaid ?? (b.payMethod === "MOBILE_MONEY" ? b.total : 0)), 0));

      <div class="kpi"><div class="kpi-lbl">Mobile Money</div><div class="kpi-val">${mm.toFixed(2)}</div></div>
      <div class="kpi"><div class="kpi-lbl">Receivable Credit</div><div class="kpi-val" style="color:${cr > 0 ? "var(--accent)" : "inherit"};">${cr.toFixed(2)}</div></div>

function bump(id, d) {
  const inp = document.getElementById(id);
  if (!inp) return;
  inp.value = Math.max(1, (parseInt(inp.value || "0", 10) || 0) + d);
  updateSellNote();
}
function onSelectSellMed() {
  const m = db.medicines.find(x => x.id === document.getElementById("sMed")?.value);
  const p = document.getElementById("sPrice");
  if (m && p && Number(m.default_unit_price) > 0) p.value = money(m.default_unit_price);

}
function updateSellNote() {
  const box = document.getElementById("sMedNote");
  const m = db.medicines.find(x => x.id === document.getElementById("sMed")?.value);
  if (!box || !m) return;
  const q = Math.max(1, parseInt(document.getElementById("sQty")?.value || "1", 10) || 1);
  const packTxt = m.pack_name && m.pack_multiplier > 1 ? ` • ${q} ${esc(m.base_unit)} = ${(q / m.pack_multiplier).toFixed(2)} ${esc(m.pack_name)}` : "";
  const caution = m.clinical_note ? `<div class="alert alert-info" style="margin:6px 0 8px;padding:7px 10px;"><strong>Clinical Note:</strong> ${esc(m.clinical_note)}</div>` : "";
  box.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Available: <b>${availQty(m.id)} ${esc(m.base_unit)}</b>${packTxt}</div>${caution}`;
}
function filterSell() {

}
function renderPayExtra() {

  else if (m === "MOBILE_MONEY") box.innerHTML = `<input id="spRef" type="text" placeholder="MM Ref / Phone" style="width:160px;" />`;
  else if (m === "CREDIT") box.innerHTML = `<input id="crCust" type="text" placeholder="Patient / Account & Phone" style="width:180px;" /><input id="crDep" type="number" step="0.01" placeholder="Deposit" style="width:110px;" />`;

}
function addBasket() {
  if (!guardAction("dispense", "queuing POS dispensing lines")) return;
  const med = db.medicines.find(x => x.id === document.getElementById("sMed")?.value);
  const qty = parseInt(document.getElementById("sQty")?.value || "0", 10);
  const unitPrice = money(parseFloat(document.getElementById("sPrice")?.value || "0"));
  const dosage = (document.getElementById("sDosage")?.value || "").trim();
  if (!med || med.nda_schedule === "RESTRICTED") return alert("Select an authorized preparation.");
  if (!Number.isInteger(qty) || qty <= 0) return alert("Enter a valid unit quantity.");
  const inB = basket.filter(x => x.medId === med.id).reduce((s, x) => s + x.qty, 0);
  if (qty + inB > availQty(med.id)) return alert(`Only ${availQty(med.id)} ${med.base_unit} eligible for dispensing.`);
  basket.push({ medId: med.id, medName: `${med.generic_name}${med.strength ? " (" + med.strength + ")" : ""}`, baseUnit: med.base_unit, qty, unitPrice, dosage });
  render();
  toast("Queued in dispensing cart");
}
function delBasket(i) { basket.splice(i, 1); render(); }
function checkout() {
  if (!guardAction("dispense", "completing dispensing transactions")) return;
  if (!basket.length) return alert("Dispensing cart is empty.");
  const grand = money(basket.reduce((s, x) => s + money(x.qty * x.unitPrice), 0));
  const payMethod = document.getElementById("sPay")?.value || "CASH";
  const payRef = (document.getElementById("spRef")?.value || "").trim();
  let cashPaid = 0, mmPaid = 0, crCust = "", crBal = 0;
  if (payMethod === "CASH") cashPaid = grand;
  else if (payMethod === "MOBILE_MONEY") mmPaid = grand;
  else if (payMethod === "SPLIT") {
    cashPaid = money(parseFloat(document.getElementById("spCash")?.value || "0"));
    mmPaid = money(parseFloat(document.getElementById("spMm")?.value || "0"));
    if (Math.abs(money(cashPaid + mmPaid) - grand) >= 0.01) return alert("Split amounts must equal total.");
  } else if (payMethod === "CREDIT") {
    crCust = (document.getElementById("crCust")?.value || "").trim();
    const dep = money(parseFloat(document.getElementById("crDep")?.value || "0"));
    if (!crCust) return alert("Enter customer / account name.");
    if (dep < 0 || dep >= grand) return alert("Deposit must be >= 0 and less than total.");
    cashPaid = dep;
    crBal = money(grand - dep);
  }
  const rcpId = "VCH-" + Date.now();
  for (const it of basket) {
    let rem = it.qty;
    const batches = db.batches.filter(b => b.medId === it.medId && isDispenseEligible(b)).sort((a, b) => a.expiry.localeCompare(b.expiry));
    for (const b of batches) {
      if (rem <= 0) break;
      const take = Math.min(b.qty, rem);
      b.qty = Math.max(0, b.qty - take);
      rem -= take;
      const lTot = money(take * it.unitPrice);
      const ratio = grand > 0 ? lTot / grand : 0;
      const saleRec = {
        id: "S-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        receiptId: rcpId, time: nowIso(), medId: it.medId, medName: it.medName,
        batchId: b.id, batchNo: b.batchNo, qty: take, unitPrice: it.unitPrice, total: lTot,
        payMethod, cashPaid: money(cashPaid * ratio), mmPaid: money(mmPaid * ratio),
        payRef: payRef || (crCust ? `Credit: ${crCust}` : ""),
        dosage: it.dosage, dispenser: currentOperator.name, voided: false
      };
      db.sales.unshift(saleRec);
      emitEvent("BATCH_DELTA", { batchId: b.id, delta: -take });
      emitEvent("SALE_LINE", { sale: saleRec });
    }
    addAudit("DISPENSE", `[${rcpId}] Dispensed ${it.qty} ${it.baseUnit} ${it.medName} (${payMethod})`);
  }
  if (payMethod === "CREDIT" && crBal > 0) {
    const cr = { id: "CRD-" + Date.now(), receiptId: rcpId, time: nowIso(), customer: crCust, total: grand, paid: cashPaid, balance: crBal, settled: false };
    db.credits.unshift(cr);
    emitEvent("CREDIT_UPSERT", { credit: cr });
  }
  basket = [];
  saveDb(); render(); viewReceipt(rcpId);
}
function voidSale(id) {
  if (!guardAction("void_sale", "voiding dispensing vouchers")) return;
  const s = db.sales.find(x => x.id === id);
  if (!s || s.voided) return;
  const reason = (prompt("Reason for voiding voucher:") || "").trim();
  if (!reason) return alert("Void reason is required.");
  s.voided = true; s.cashPaid = 0; s.mmPaid = 0;
  const b = db.batches.find(x => x.id === s.batchId);
  if (b) b.qty += s.qty;
  emitEvent("SALE_VOID", { saleId: s.id });
  addAudit("VOID_VOUCHER", `Voided ${s.id} (+${s.qty} restored to batch ${s.batchNo}) — ${reason}`);
  saveDb(); render();
}
function viewReceipt(key) {

function payCr(id) {
  if (!guardAction("settle_credit", "settling credit balances")) return;
  const c = db.credits.find(x => x.id === id);
  if (!c) return;
  const amt = money(parseFloat(prompt(`Open balance: ${money(c.balance).toFixed(2)}. Enter settlement amount:`) || "0"));

  c.balance = money(c.balance - amt);
  if (c.balance <= 0) c.settled = true;
  emitEvent("CREDIT_UPSERT", { credit: c });
  addAudit("CREDIT_SETTLE", `Settled ${amt.toFixed(2)} against ${c.receiptId}`);
  saveDb(); render();
}

        <div class="qr-box">${IsoQrEngine.encodeSvg(payloadStr, 188)}</div>
        <div style="flex:1;min-width:250px;">
          ${lanBadge} <span class="badge ${isOwnerMode ? "info" : "ok"}">${isOwnerMode ? "OWNER CLEARANCE" : "STAFF CLEARANCE"}</span>
          <div style="font-size:13px;margin-top:8px;line-height:1.55;">
            ${isOwnerMode
              ? "<strong>Owner / Administrator Credential:</strong> Authorizes full event telemetry, audit log access, and administrative synchronization on paired mobile devices."
              : "<strong>Staff / Dispenser Credential:</strong> Restricted to operational barcode scanning, POS sales streaming (<code>/api/events</code>), and stock counts; blocks audit access and administrative changes."}
          </div>
          <div style="margin-top:8px;font-size:12px;color:var(--muted);word-break:break-all;">
            Pairing Payload: <code>${esc(payloadStr)}</code>
          </div>
          <div class="row" style="margin-top:10px;margin-bottom:0;">
            <button class="ghost" onclick="syncGatewayNow()">Refresh LAN &amp; Sync</button>
            <button class="ghost" onclick="copyPairPayload()">Copy Payload</button>
            <button class="danger" style="min-height:32px;padding:4px 10px;font-size:12px;" onclick="rotateGatewayKeys()">Rotate Pairing Keys</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Cloud Synchronization Relay</h3>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px;">
        Status: <strong>${cfg.enabled ? `Enabled (${esc(cfg.url)} • Facility: ${esc(cfg.shopId)})` : "Local Gateway Only"}</strong> &bull; Pending outbox events: <strong>${(db.syncOutbox || []).length}</strong>
      </p>
      <div class="row">
        <button class="accent" onclick="setupCloudSyncPrompt()">Configure Cloud Relay</button>
        <button class="primary" onclick="flushCloudOutbox()">Flush Outbox Now</button>
      </div>
    </div>

    <div class="card">
      <h3>Clearance Roles &amp; Authorization PINs</h3>
      <div class="table-wrap"><table><thead><tr><th>Designation</th><th>Clearance Tier</th><th>Registration</th><th>PIN Status</th><th>Credential Action</th></tr></thead><tbody>${staffRows}</tbody></table></div>
    </div>

    <div class="card">
      <h3>Facility &amp; Regulatory Licensing</h3>
      <div class="row">
        <input id="aName" type="text" value="${esc(db.shop.name)}" style="flex:1;min-width:220px;" />
        <input id="aNda" type="text" value="${esc(db.shop.nda)}" placeholder="NDA Licence No." />
        <input id="aLg" type="text" value="${esc(db.shop.lg)}" placeholder="Local Gov Licence No." />
        <button class="primary" onclick="saveShop()">Save Licensing</button>
      </div>
    </div>
  `;
}

function setPairingMode(mode) {
  activePairingMode = mode === "OWNER" ? "OWNER" : "STAFF";
  render();
}

function setStaffPin(staffId) {
  if (!guardAction("staff", "updating clearance PINs")) return;
  const member = db.staff.find(s => s.id === staffId);
  if (!member) return;
  const nextPin = prompt(`Set authorization PIN for ${member.name} (leave blank for unrestricted):`, member.pin || "");
  if (nextPin === null) return;
  member.pin = nextPin.trim();
  addAudit("PIN_CHANGED", `Updated authorization PIN for ${member.name} (${member.role})`);
  saveDb(); render(); toast("Authorization PIN updated");
}

function copyPairPayload() {
  const str = activePairingMode === "OWNER" ? gatewayInfo.ownerQrPayload : gatewayInfo.staffQrPayload;
  if (!str) return;
  navigator.clipboard?.writeText(str).catch(() => {});
  toast("Pairing payload copied");
}

function saveShop() {
  if (!guardAction("admin", "updating facility licensing details")) return;
  db.shop.name = document.getElementById("aName").value.trim() || "SSEDDUME DRUG SHOP MANAGEMENT SYSTEM";
  db.shop.nda = document.getElementById("aNda").value.trim();
  db.shop.lg = document.getElementById("aLg").value.trim();
  addAudit("LICENSING_UPDATE", "Updated facility and regulatory licence metadata");
  saveDb(); render(); toast("Licensing saved");
}

function exportBundleJson() {
  const snap = JSON.parse(JSON.stringify(db));
  const pkg = { system: "SSEDDUME DRUG SHOP MANAGEMENT SYSTEM", exportedAt: nowIso(), checksum: checksum(snap), data: snap };
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `sseddume-gateway-snapshot-${todayStr()}.json`;
  a.click();
  toast("Snapshot exported");
}

async function importBundleJson(ev) {
  if (!guardAction("admin", "importing external data snapshots")) { ev.target.value = ""; return; }
  const f = ev.target.files?.[0];
  ev.target.value = "";
  if (!f) return;
  try {
    const raw = JSON.parse(await f.text());
    const payload = raw?.snapshot && typeof raw.snapshot === "object" ? raw.snapshot : (raw?.data && typeof raw.data === "object" ? raw.data : raw);
    if (raw?.checksum && checksum(payload) !== raw.checksum) return alert("Checksum verification failed — snapshot is corrupted.");
    if (!Array.isArray(payload.medicines) || !Array.isArray(payload.batches) || !Array.isArray(payload.sales)) return alert("Invalid snapshot structure.");

    for (const m of payload.medicines) {
      const i = db.medicines.findIndex(x => x.id === m.id);
      if (i >= 0) Object.assign(db.medicines[i], m);
      else db.medicines.push(m);
    }
    for (const b of payload.batches) {
      const i = db.batches.findIndex(x => x.id === b.id);
      if (i < 0) db.batches.push(b);
      else if (db.batches[i].qty === 0 && b.qty > 0) db.batches[i].qty = b.qty;
    }
    for (const s of payload.sales) {
      if (!db.sales.some(x => x.id === s.id)) db.sales.unshift(s);
    }
    if (payload.shop) db.shop = { ...db.shop, ...payload.shop };
    addAudit("SNAPSHOT_IMPORT", `Merged snapshot ${f.name}`);
    saveDb(); render(); toast("Snapshot merged");
  } catch (err) {
    alert("Snapshot import error: " + (err?.message || err));
  }
}

(async () => {
  await fetchGatewayInfo();
  renderTopbar();
  render();
  pollGatewayEvents();
  flushCloudOutbox();
})();
</script>
</body>
</html>
